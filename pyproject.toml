[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "paminaw"
version = "1.0.0"
description = "Workshop companion: speech recognition for Cebuano and Tagalog with PyTorch (PyCon Davao 2026)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nash Golosino" }, { name = "Aurora Manseras" }]
keywords = ["speech recognition", "asr", "pytorch", "cebuano", "tagalog", "fleurs", "workshop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Lower bounds only: Colab already ships torch/torchaudio, and reinstalling them
# would blow the 3-minute budget of cell 0. Tested versions: constraints/colab-2026-10.txt
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.44.2,<6",
  "jiwer==4.0.0",            # exact version used in the paper (Sect. 3.3)
  "soundfile>=0.12",
  "huggingface_hub>=0.24",
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
hf = ["datasets>=2.21", "pyarrow>=14"]
large = ["sentencepiece>=0.2", "protobuf>=4", "accelerate>=0.34"]
dev = [
  "pytest>=8",
  "ruff==0.17.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6",
  "pyarrow>=14",
]

[project.scripts]
paminaw = "paminaw.cli:main"

[project.urls]
Homepage = "https://github.com/GNash19/paminaw"
Issues = "https://github.com/GNash19/paminaw/issues"
Paper-data = "https://doi.org/10.5281/zenodo.23010849"

[tool.hatch.build.targets.wheel]
packages = ["src/paminaw"]

# Ship the small data files inside the wheel so `pip install git+...` works in Colab.
[tool.hatch.build.targets.wheel.force-include]
"data/subset_manifest.csv" = "paminaw/_data/subset_manifest.csv"
"data/precomputed" = "paminaw/_data/precomputed"
"data/ATTRIBUTION.md" = "paminaw/_data/ATTRIBUTION.md"

[tool.hatch.build.targets.sdist]
include = ["src", "data/subset_manifest.csv", "data/precomputed", "data/ATTRIBUTION.md",
           "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]  # generated by scripts/build_notebooks.py, which is linted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and arrows in prose are intentional

[tool.ruff.lint.per-file-ignores]
# Notebook cell sources live in strings here; their lines match the slides, not this file.
"scripts/build_notebooks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
